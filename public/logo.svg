<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for Gradients and Glows -->
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    
    <!-- Gold Gradient for Shield Border -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Emerald/Mint Accent for Graph path -->
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    
    <!-- Subtle glow filter -->
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Circular Background with subtle gold border -->
  <circle cx="256" cy="256" r="240" fill="url(#bg-grad)" stroke="url(#gold-grad)" stroke-width="4" />

  <!-- Shield Base shape -->
  <path d="M 256 100 
           C 340 100, 390 120, 390 180 
           C 390 280, 290 380, 256 410 
           C 222 380, 122 280, 122 180 
           C 122 120, 172 100, 256 100 Z" 
        fill="#020617" 
        stroke="url(#gold-grad)" 
        stroke-width="12" 
        stroke-linejoin="round"
        filter="url(#gold-glow)" />

  <!-- Inner Decorative Shield in Gold/Translucent -->
  <path d="M 256 125 
           C 320 125, 360 141, 360 185 
           C 360 260, 282 342, 256 370 
           C 230 342, 152 260, 152 185 
           C 152 141, 192 125, 256 125 Z" 
        fill="none" 
        stroke="url(#gold-grad)" 
        stroke-width="3" 
        stroke-dasharray="8 6" 
        opacity="0.6" />

  <!-- Growing Bullish Graph Line (Graph Segment inside Shield) -->
  <path d="M 170 290 
           L 220 250 
           L 270 280 
           L 340 190" 
        fill="none" 
        stroke="url(#emerald-grad)" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
        
  <!-- Sparkle/Wealth Star at the peak of the chart -->
  <path d="M 340 190 L 345 175 L 360 170 L 345 165 L 340 150 L 335 165 L 320 170 L 335 175 Z" 
        fill="#F59E0B" />
</svg>
